name: Apply final average bill fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-off-complete-average-bill.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir campo e resumo da fatura
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          payback_path = Path('src/pages/propostas/PaybackStep.tsx')
          source = payback_path.read_text(encoding='utf-8')

          start = source.index('function PaybackField({')
          end = source.index('\n\nexport function PaybackStep', start)
          replacement = '''function PaybackField({
            label,
            value,
            onChange,
            prefix,
            suffix,
            helper,
            min = 0,
            max,
          }: {
            label: string;
            value: string;
            onChange: (value: string) => void;
            prefix?: string;
            suffix?: string;
            helper?: string;
            min?: number;
            max?: number;
          }) {
            const inputClassName = [prefix ? 'pl-10' : '', suffix ? 'pr-24' : '']
              .filter(Boolean)
              .join(' ');

            return (
              <label className="space-y-2">
                <span className="text-sm font-semibold text-brand-dark">{label}</span>
                <div className="relative">
                  <Input
                    type="number"
                    min={min}
                    max={max}
                    step="0.01"
                    value={value}
                    onChange={(event) => onChange(event.target.value)}
                    className={inputClassName || undefined}
                  />
                  {prefix && (
                    <span className="pointer-events-none absolute inset-y-0 left-3 flex items-center text-xs font-semibold text-slate-500">
                      {prefix}
                    </span>
                  )}
                  {suffix && (
                    <span className="pointer-events-none absolute inset-y-0 right-3 flex items-center text-xs font-semibold text-slate-500">
                      {suffix}
                    </span>
                  )}
                </div>
                {helper && <p className="text-xs leading-5 text-slate-500">{helper}</p>}
              </label>
            );
          }'''
          source = source[:start] + replacement + source[end:]

          label = 'label="Valor médio mensal da fatura"'
          if label not in source:
            anchor = '          <PaybackField label="PIS" value={form.pisPercent} onChange={(value) => updateField(\'pisPercent\', value)} suffix="%" />'
            if source.count(anchor) != 1:
              raise RuntimeError('Âncora do campo PIS não encontrada.')
            field = '''          <PaybackField
            label="Valor médio mensal da fatura"
            value={form.averageMonthlyBillAmount ?? ''}
            onChange={(value) => updateField('averageMonthlyBillAmount', value)}
            prefix="R$"
            min={0.01}
            helper="Opcional. Use a média das últimas contas para comparar a fatura atual com a estimativa após a instalação."
          />
'''
            source = source.replace(anchor, field + anchor, 1)

          payback_path.write_text(source, encoding='utf-8')

          calculator_path = Path('src/pages/propostas/ProfessionalSizingCalculatorView.tsx')
          calculator = calculator_path.read_text(encoding='utf-8')
          reduction_label = 'label="Redução estimada da fatura"'
          if reduction_label not in calculator:
            anchor = '                            <PreviewRow label="Margem aplicada" value={`${number.format(paybackResult.marginPercentage)}%`} />'
            if calculator.count(anchor) != 1:
              raise RuntimeError('Âncora da margem não encontrada.')
            rows = '''
                            {paybackResult.averageMonthlyBillAmount != null && (
                              <>
                                <PreviewRow label="Fatura média atual" value={`R$ ${number.format(paybackResult.averageMonthlyBillAmount)}`} />
                                <PreviewRow label="Fatura residual estimada" value={`R$ ${number.format(paybackResult.estimatedResidualBillAmount ?? 0)}`} />
                                <PreviewRow label="Redução estimada da fatura" value={`${number.format(paybackResult.estimatedBillReductionPercent ?? 0)}%`} />
                              </>
                            )}'''
            calculator = calculator.replace(anchor, anchor + rows, 1)

          calculator_path.write_text(calculator, encoding='utf-8')

          assert payback_path.read_text(encoding='utf-8').count(label) == 1
          assert reduction_label in calculator_path.read_text(encoding='utf-8')
          PY

      - name: Commit direto na main
        shell: bash
        run: |
          rm -f .github/workflows/one-off-complete-average-bill.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(payback): concluir campo e resumo da fatura média"
          git push origin HEAD:main
