name: Remover oversizing de kits fechados

on:
  push:
    branches: [main]

permissions:
  contents: write
  statuses: write

concurrency:
  group: remove-closed-kit-oversizing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar código e histórico
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remover oversizing e limites DC/AC
        id: apply_change
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 .github/scripts/remove-closed-kit-oversizing.py 2>&1 | tee apply.log

      - name: Publicar diagnóstico da remoção
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.apply_change.outcome }}
        run: |
          python3 .github/scripts/publish-diagnostic-status.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --context "Remoção do oversizing" \
            --outcome "$OUTCOME" \
            --log apply.log

      - name: Instalar dependências
        id: install
        if: steps.apply_change.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee install.log

      - name: Verificar TypeScript
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Executar testes
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee tests.log

      - name: Gerar build de produção
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build:app 2>&1 | tee build.log

      - name: Publicar alteração validada
        if: steps.apply_change.outcome == 'success' && steps.install.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.tests.outcome == 'success' && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remover oversizing de kits fechados"
          git push origin HEAD:main

      - name: Falhar quando alguma validação não passar
        if: always()
        run: |
          test "${{ steps.apply_change.outcome }}" = success
          test "${{ steps.install.outcome }}" = success
          test "${{ steps.typecheck.outcome }}" = success
          test "${{ steps.tests.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
