name: One-off advanced payback

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verificar necessidade da alteração
        id: needed
        shell: bash
        run: |
          if grep -q "internalRateOfReturnPercent" src/lib/calculations/payback.ts; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Aplicar alterações
        id: apply
        if: steps.needed.outputs.value == 'true'
        shell: bash
        run: |
          set +e
          python3 .github/scripts/apply-advanced-payback.py > advanced-payback-apply.log 2>&1
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -ne 0 ]; then
            mkdir -p docs
            cp advanced-payback-apply.log docs/.advanced-payback-error.log
          fi

      - name: Registrar erro do aplicador
        if: steps.needed.outputs.value == 'true' && steps.apply.outputs.exit_code != '0'
        shell: bash
        run: |
          git config user.name "Sol Amigo Automation"
          git config user.email "actions@github.com"
          git add docs/.advanced-payback-error.log
          git commit -m "chore: registrar erro do aplicador de payback"
          git push
          exit 1

      - name: Instalar dependências
        if: steps.needed.outputs.value == 'true' && steps.apply.outputs.exit_code == '0'
        run: npm ci

      - name: Verificar TypeScript
        if: steps.needed.outputs.value == 'true' && steps.apply.outputs.exit_code == '0'
        run: npm run typecheck

      - name: Executar testes
        if: steps.needed.outputs.value == 'true' && steps.apply.outputs.exit_code == '0'
        run: npm run test

      - name: Gerar build
        if: steps.needed.outputs.value == 'true' && steps.apply.outputs.exit_code == '0'
        run: npm run build:app

      - name: Publicar motor validado
        if: steps.needed.outputs.value == 'true' && steps.apply.outputs.exit_code == '0'
        shell: bash
        run: |
          git config user.name "Sol Amigo Automation"
          git config user.email "actions@github.com"
          git add src tests
          git commit -m "feat(payback): projetar fluxo de caixa e indicadores avançados"
          git push