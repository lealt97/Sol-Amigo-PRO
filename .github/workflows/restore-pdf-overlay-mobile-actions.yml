name: Restaurar overlays clicáveis do PDF

on:
  push:
    paths:
      - '.github/workflows/restore-pdf-overlay-mobile-actions.yml'

permissions:
  contents: write

jobs:
  restore-overlays:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar visual e corrigir toque
        run: python .github/scripts/restore-pdf-overlay-mobile-actions.py

      - name: Remover arquivos temporários
        run: |
          rm -f .github/scripts/restore-pdf-overlay-mobile-actions.py
          rm -f .github/workflows/restore-pdf-overlay-mobile-actions.yml

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Gerar build de produção
        run: npm run build:app -- --base=/Sol-Amigo-PRO/

      - name: Publicar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restaurar overlays clicáveis do PDF no mobile"
          git push
