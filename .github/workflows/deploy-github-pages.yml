name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Gerar site estático
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Instalar dependências
        run: npm ci

      - name: Gerar build de produção
        run: npm run build:app -- --base=/Sol-Amigo-PRO/
        env:
          VITE_SUPABASE_URL: https://ztlrnbailbcenkvtfoln.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_0JK8u2BjT_LPaG5eSekc6w_WHu1IrBY

      - name: Preparar rotas da aplicação
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publicar site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
