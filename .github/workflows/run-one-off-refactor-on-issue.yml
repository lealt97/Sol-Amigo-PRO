name: Run one-off roof refactor on issue

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write

jobs:
  run-refactor:
    if: github.event.issue.title == '[internal] apply roof area kit dimensions'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Extract and run refactor script
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/one-off-roof-area-kit-dimensions.yml').read_text(encoding='utf-8')
          marker_start = "          python3 <<'PY'\n"
          marker_end = "\n          PY\n"
          start = source.index(marker_start) + len(marker_start)
          end = source.index(marker_end, start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/roof_refactor.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/roof_refactor.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Commit directly to main
        shell: bash
        run: |
          git config user.name "SolAmigo Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src tests supabase/migrations
          git commit -m "feat(kits): mover dimensões dos módulos para o cadastro do kit"
          git push origin HEAD:main
