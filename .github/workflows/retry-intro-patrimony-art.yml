name: Finalizar arte patrimonial do resumo

on:
  push:
    paths:
      - '.github/workflows/retry-intro-patrimony-art.yml'

permissions:
  contents: write

jobs:
  integrate-art:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tornar o caminho compatível com navegador e testes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply-intro.py')
          source = path.read_text(encoding='utf-8')
          old = (
              '    "const introPatrimonyImage = `${import.meta.env.BASE_URL}'
              'pdf-assets/illustrations/sua-energia-pode-trabalhar-a-favor-do-seu-patrimonio.svg`;\\n\\n"'
              + chr(10)
          )
          new = (
              '    "const baseUrl = import.meta.env?.BASE_URL ?? \'/\';\\n"'
              + chr(10)
              + '    "const introPatrimonyImage = `${baseUrl}'
              'pdf-assets/illustrations/sua-energia-pode-trabalhar-a-favor-do-seu-patrimonio.svg`;\\n\\n"'
              + chr(10)
          )
          if old not in source:
              raise SystemExit('Trecho do caminho da arte não encontrado.')
          source = source.replace(old, new, 1)
          source = source.replace(
              '  assert.match(imageModule, /import\\.meta\\.env\\.BASE_URL/);',
              '  assert.match(imageModule, /BASE_URL/);',
              1,
          )
          path.write_text(source, encoding='utf-8')
          PY

      - name: Reconstruir SVG e integrar nas páginas
        run: python .github/scripts/apply-intro.py

      - name: Remover arquivos temporários
        run: |
          rm -rf .github/intro-art-parts
          rm -f .github/scripts/apply-intro.py
          rm -f .github/workflows/apply-intro-patrimony-art.yml
          rm -f .github/workflows/retry-intro-patrimony-art.yml

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Gerar build do GitHub Pages
        run: npm run build:app -- --base=/Sol-Amigo-PRO/

      - name: Publicar integração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrar arte de valorização patrimonial no resumo"
          git push
