name: Aplicar correção da prévia PDF
on:
  push:
    paths:
      - .github/workflows/apply-pdf-preview-mobile-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/fix-pdf-preview-mobile-parity.py
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:app -- --base=/Sol-Amigo-PRO/
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/design-pdf/components/PdfPreview.tsx src/features/design-pdf/components/DesignPdfEditor.tsx tests/pdf-preview-mobile-parity.test.ts
          git commit -m "fix: preservar layout A4 no mobile"
          git push
