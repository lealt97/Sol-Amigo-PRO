name: Remover oversizing de kits fechados

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: remove-closed-kit-oversizing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar código e histórico
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remover oversizing e limites DC/AC
        run: python3 .github/scripts/remove-closed-kit-oversizing.py

      - name: Instalar dependências
        run: npm ci

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Executar testes
        run: npm run test

      - name: Gerar build de produção
        run: npm run build:app

      - name: Publicar alteração validada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Nenhuma alteração funcional pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remover oversizing de kits fechados"
          git push origin HEAD:main
