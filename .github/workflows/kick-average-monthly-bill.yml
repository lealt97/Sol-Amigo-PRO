name: Kick average monthly bill implementation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kick-average-monthly-bill.yml

permissions:
  contents: write

jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Executar implementação preparada
        id: implement
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 <<'PY' 2>&1 | tee implementation.log
          from pathlib import Path

          workflow_path = Path('.github/workflows/one-off-average-monthly-bill.yml')
          lines = workflow_path.read_text(encoding='utf-8').splitlines()
          start = next(index for index, line in enumerate(lines) if line.strip() == "python3 <<'PY'") + 1
          end = next(index for index in range(start, len(lines)) if lines[index].strip() == 'PY')
          implementation_lines = [
              line[10:] if line.startswith('          ') else line
              for line in lines[start:end]
          ]
          prepared = '\n'.join(implementation_lines) + '\n'
          tail_marker = '# Formulário e apresentação do payback.'
          tail_start = prepared.index(tail_marker)
          helpers = """from pathlib import Path\n\ndef read(path: str) -> str:\n    return Path(path).read_text(encoding='utf-8')\n\ndef write(path: str, content: str) -> None:\n    Path(path).write_text(content, encoding='utf-8')\n\n"""
          implementation = helpers + prepared[tail_start:]

          fragile = """if content.count(old_field) != 1:\n    raise RuntimeError('PaybackStep: bloco PaybackField não encontrado de forma única')\ncontent = content.replace(old_field, new_field, 1)"""
          robust = """field_start = content.index('function PaybackField({')\nfield_end = content.index('\\n\\nexport function PaybackStep', field_start)\ncontent = content[:field_start] + new_field + content[field_end:]"""
          if fragile not in implementation:
              raise RuntimeError('Trecho frágil do PaybackField não encontrado no executor preparado.')
          implementation = implementation.replace(fragile, robust, 1)

          exec(compile(implementation, str(workflow_path), 'exec'))
          PY

      - name: Instalar dependências
        id: install
        if: steps.implement.outcome == 'success'
        continue-on-error: true
        run: npm ci 2>&1 | tee install.log

      - name: Validar TypeScript
        id: typecheck
        if: steps.implement.outcome == 'success' && steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck 2>&1 | tee typecheck.log

      - name: Executar testes
        id: tests
        if: steps.implement.outcome == 'success' && steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run test 2>&1 | tee tests.log

      - name: Gerar build
        id: build
        if: steps.implement.outcome == 'success' && steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build:app 2>&1 | tee build.log

      - name: Commit direto na main
        if: always()
        shell: bash
        env:
          IMPLEMENT: ${{ steps.implement.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$IMPLEMENT" = "success" ] && [ "$INSTALL" = "success" ] && [ "$TYPECHECK" = "success" ] && [ "$TESTS" = "success" ] && [ "$BUILD" = "success" ]; then
            rm -f .github/workflows/kick-average-monthly-bill.yml
            rm -rf diagnostics/average-monthly-bill
            MESSAGE="feat(payback): adicionar comparação com fatura média mensal"
          else
            mkdir -p diagnostics/average-monthly-bill
            {
              echo "implement=$IMPLEMENT"
              echo "install=$INSTALL"
              echo "typecheck=$TYPECHECK"
              echo "tests=$TESTS"
              echo "build=$BUILD"
              for file in implementation.log install.log typecheck.log tests.log build.log; do
                if [ -f "$file" ]; then
                  echo
                  echo "===== $file ====="
                  cat "$file"
                fi
              done
            } > diagnostics/average-monthly-bill/status.txt
            MESSAGE="chore: registrar diagnóstico da fatura média"
          fi

          git add -A
          git commit -m "$MESSAGE"
          git push origin HEAD:main
