name: One-off fix payback render loop

on:
  push:
    branches: [main]
    paths:
      - docs/.fix-payback-render-loop

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Corrigir normalização do formulário
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/pages/propostas/PaybackStep.tsx')
          source = path.read_text(encoding='utf-8')
          old = """const normalizeForm = (form: ProposalDraftPaybackForm): PaybackFormState => ({
  ...form,
  averageMonthlyBillAmount: form.averageMonthlyBillAmount ?? '',
});"""
          new = """const normalizeForm = (form: ProposalDraftPaybackForm): PaybackFormState => {
  if (typeof form.averageMonthlyBillAmount === 'string') return form;

  return {
    ...form,
    averageMonthlyBillAmount: '',
  };
};"""
          if source.count(old) != 1:
            raise RuntimeError(f'Bloco normalizeForm encontrado {source.count(old)} vezes.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/average-monthly-bill-flow.test.ts')
          tests = test_path.read_text(encoding='utf-8')
          regression = """

test('a normalização preserva a referência e evita ciclo infinito entre filho e pai', async () => {
  const source = await readFile(PAYBACK_STEP, 'utf8');

  assert.match(source, /typeof form\.averageMonthlyBillAmount === 'string'\) return form/);
  assert.doesNotMatch(source, /const normalizeForm = .*=> \(\{[\s\S]*\.\.\.form/);
});
"""
          if 'a normalização preserva a referência e evita ciclo infinito entre filho e pai' not in tests:
            test_path.write_text(tests.rstrip() + regression, encoding='utf-8')
          PY

      - name: Instalar dependências
        run: npm ci

      - name: Validar TypeScript
        run: npm run typecheck

      - name: Executar testes
        run: npm run test

      - name: Gerar build
        run: npm run build:app

      - name: Publicar correção na main
        shell: bash
        run: |
          rm -f docs/.fix-payback-render-loop
          rm -f .github/workflows/one-off-fix-payback-render-loop.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(payback): impedir ciclo infinito de renderização"
          git push origin HEAD:main
