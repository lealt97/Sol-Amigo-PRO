name: Cancelar deployment órfão pelo SHA

on:
  push:
    paths:
      - .github/workflows/recover-pages-deployment-by-sha.yml

permissions:
  contents: write
  pages: write

jobs:
  cancel-orphan:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ORPHAN_SHA: 14e07cf2b323fd0f61543af506bf60eb91cfeb56
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cancelar pelo identificador aceito pelo GitHub Pages
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/deployments/$ORPHAN_SHA/cancel"
          sleep 12

      - name: Remover workflow temporário
        run: |
          rm -f .github/workflows/recover-pages-deployment-by-sha.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remover cancelamento temporário do Pages"
          git push
