name: Integrar arte patrimonial do resumo

on:
  push:
    paths:
      - '.github/workflows/apply-intro-patrimony-art.yml'

permissions:
  contents: write

jobs:
  integrate-art:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruir SVG e integrar nas páginas
        run: python .github/scripts/apply-intro.py

      - name: Remover arquivos temporários
        run: |
          rm -rf .github/intro-art-parts
          rm -rf .github/scripts/apply-intro.py
          rm .github/workflows/apply-intro-patrimony-art.yml

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Gerar build do GitHub Pages
        run: npm run build:app -- --base=/Sol-Amigo-PRO/

      - name: Publicar integração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrar arte de valorização patrimonial no resumo"
          git push
