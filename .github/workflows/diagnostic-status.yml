name: Aplicar integração da entrega

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar alteração
        run: python3 .github/scripts/integrate-proposal-delivery-step.py
      - name: Commitar no main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/propostas/ProfessionalSizingCalculatorView.tsx tests/proposal-delivery-wizard-step.test.ts
          git commit -m "feat: integrar geração e envio ao final da proposta"
          git push origin main
