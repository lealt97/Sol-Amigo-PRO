name: Apply Sol Amigo PRO brand

on:
  push:
    branches: [main]
    paths:
      - docs/.apply-sol-amigo-pro-brand

permissions:
  contents: write

jobs:
  apply-brand:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Aplicar nova identidade visual
        run: python3 .github/scripts/apply-sol-amigo-pro-brand.py

      - name: Instalar dependências
        run: npm ci

      - name: Validar TypeScript
        run: npm run typecheck

      - name: Executar testes
        run: npm run test

      - name: Gerar build
        run: npm run build:app

      - name: Publicar na main e limpar aplicador
        shell: bash
        run: |
          rm -f docs/.apply-sol-amigo-pro-brand
          rm -f .github/scripts/apply-sol-amigo-pro-brand.py
          rm -f .github/workflows/one-off-apply-sol-amigo-pro-brand.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(brand): aplicar nova identidade Sol Amigo PRO"
          git push origin HEAD:main
