name: Aplicar entrega da proposta

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-proposal-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    name: Aplicar, validar e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aplicar integração
        run: |
          python3 .github/scripts/implement-proposal-delivery.py
          python3 .github/scripts/fix-proposal-delivery.py

      - name: Adicionar gerador de QR Code
        run: |
          npm install qrcode@1.5.4 --save
          npm install @types/qrcode@1.5.5 --save-dev

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Executar testes
        run: npm run test

      - name: Gerar build de produção
        run: npm run build:app

      - name: Publicar alterações no main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src tests
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
            exit 0
          fi
          git commit -m "feat: adicionar entrega de proposta com PDF e WhatsApp"
          git push origin HEAD:main
