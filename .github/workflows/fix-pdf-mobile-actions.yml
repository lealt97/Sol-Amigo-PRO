name: Corrigir ações do PDF no mobile

on:
  push:
    paths:
      - '.github/workflows/fix-pdf-mobile-actions.yml'

permissions:
  contents: write

jobs:
  fix-mobile-actions:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir substituição dos testes
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/fix-pdf-mobile-actions.py')
          source = path.read_text(encoding='utf-8')
          old = "updated, count = pattern.subn(replacement.rstrip() + '\\n', source, count=1)"
          new = "updated, count = pattern.subn(lambda _: replacement.rstrip() + '\\n', source, count=1)"
          if old not in source:
              raise SystemExit('Trecho de substituição dos testes não encontrado.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Aplicar correção de acessibilidade mobile
        run: python .github/scripts/fix-pdf-mobile-actions.py

      - name: Remover arquivos temporários
        run: |
          rm -f .github/scripts/fix-pdf-mobile-actions.py
          rm -f .github/workflows/fix-pdf-mobile-actions.yml

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Gerar build de produção
        run: npm run build:app -- --base=/Sol-Amigo-PRO/

      - name: Publicar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: tornar ações do PDF acessíveis no mobile"
          git push
